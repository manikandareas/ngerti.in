# Optional self-hosted memory service. It owns indexing, never agent execution.
services:
  memory:
    image: ghcr.io/vectorize-io/hindsight@sha256:b4d3b76f363aa40cf348450e7f8f52a50653008731b99824b14623a196182e73
    ports:
      - "127.0.0.1:${MEMORY_API_PORT:-8888}:8888"
      - "127.0.0.1:${MEMORY_UI_PORT:-9999}:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:?Choose a memory extraction provider}
      HINDSIGHT_API_LLM_MODEL: ${MEMORY_LLM_MODEL:?Choose a memory extraction model}
      HINDSIGHT_API_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      HINDSIGHT_API_WORKER_ID: ngertiin-memory
    shm_size: 512m
    volumes:
      - memory-data:/home/hindsight/.pg0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  memory-data:
