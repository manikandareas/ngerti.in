# Persistent local development database. Run with Docker's orbstack context.
name: ngertiin-local
services:
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    container_name: ngertiin-postgres18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ngertiin
      POSTGRES_USER: ngertiin
      POSTGRES_PASSWORD: ${NGERTIIN_POSTGRES_PASSWORD:?Set NGERTIIN_POSTGRES_PASSWORD in the private environment}
    ports:
      - "127.0.0.1:${NGERTIIN_POSTGRES_PORT:-55472}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ngertiin -d ngertiin"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
volumes:
  postgres-data:
    name: ngertiin_postgres18_data
