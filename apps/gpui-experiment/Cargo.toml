[package]
name = "ngertiin-gpui-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "syntect"] }
gpui-webview = { version = "=0.9.0", features = ["gpui-fast"] }
wry = { version = "=0.53.3", package = "lb-wry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
