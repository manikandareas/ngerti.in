[project]
name = "ngertiin-engine"
version = "0.1.0"
description = "Owner-scoped adapter inside the pinned Hermes gateway"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
ngertiin-engine = "ngertiin_engine.service:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngertiin_engine"]

[tool.pytest.ini_options]
markers = ["platforms: upstream host platform marker"]
