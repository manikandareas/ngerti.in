name: Static checks and builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: bun install --frozen-lockfile
      - run: uv sync --project apps/backend --locked
      - run: bun run check
      - run: bun run build
      - run: uv build --project apps/backend
