[project]
name = "ngertiin-backend"
version = "0.1.0"
description = "Ngertiin API and durable workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "alembic",
  "psycopg[binary,pool]",
  "pgvector",
  "procrastinate",
  "langchain",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "clerk-backend-api",
  "pydantic",
  "pydantic-settings",
  "boto3",
  "structlog",
  "python-multipart",
  "langchain-openai>=1,<2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "boto3-stubs[s3]",
    "daytona==0.225.0",
    "websockets>=15,<16",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngertiin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/ngertiin"]
