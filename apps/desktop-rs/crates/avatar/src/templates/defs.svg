<defs>
<filter id="avatar-fuzz" x="-15%" y="-15%" width="130%" height="130%">
<feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="12" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="avatar-eye-shadow" x="-100%" y="-70%" width="300%" height="300%"><feDropShadow dx="0" dy=".35" stdDeviation=".65" flood-color="#100c14" flood-opacity=".8" result="contact-shadow"/>
<feGaussianBlur in="SourceAlpha" stdDeviation=".85" result="soft-edge"/>
<feOffset in="soft-edge" dx="0" dy="1" result="inset-offset"/>
<feComposite in="SourceAlpha" in2="inset-offset" operator="out" result="inset-edge"/>
<feFlood flood-color="#08060c" flood-opacity=".85" result="inset-color"/>
<feComposite in="inset-color" in2="inset-edge" operator="in" result="inset-shadow"/>
<feMerge><feMergeNode in="contact-shadow"/><feMergeNode in="inset-shadow"/></feMerge></filter>
<radialGradient id="avatar-eye-color" cx=".32" cy=".24" r=".8"><stop stop-color="#625c68"/><stop offset=".22" stop-color="#302b36"/><stop offset=".6" stop-color="#17131d"/><stop offset="1" stop-color="#0c0911"/></radialGradient>
<mask id="avatar-fur-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><path d="$PATH" fill="white" stroke="white" stroke-width="3" filter="url(#avatar-fuzz)"/></mask>
<radialGradient id="avatar-clay" cx=".32" cy=".2" r=".9"><stop stop-color="$BASE"/><stop offset=".5" stop-color="$BASE"/><stop offset="1" stop-color="$SHADE"/></radialGradient>
<radialGradient id="avatar-sheen" cx=".28" cy=".15" r=".7"><stop stop-color="#fff" stop-opacity=".4"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="avatar-ground"><stop stop-color="#252332" stop-opacity=".17"/><stop offset="1" stop-color="#252332" stop-opacity="0"/></radialGradient>
</defs>
