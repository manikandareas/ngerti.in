[workspace]
members = ["crates/desktop", "crates/client", "crates/avatar"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
