<!doctype html>
<html lang="id"><meta charset="utf-8"><title>NG031 shared desktop</title>
<style>body{font:24px system-ui;padding:40px;background:#eef3eb;color:#19291e}input{font:24px system-ui;width:90%;padding:16px}button{font:24px system-ui;padding:12px;margin-top:20px}pre{white-space:pre-wrap}</style>
<h1>NG031 · Desktop bersama</h1>
<p>Browser, profile dan input ini dipakai agent serta manusia pada satu sesi.</p>
<label for="marker">Marker sesi</label><input id="marker" autofocus placeholder="Isi marker melalui desktop">
<button id="save">Simpan marker pada profile</button><pre id="result"></pre>
<script>
const marker=document.querySelector('#marker'),result=document.querySelector('#result');
marker.value=localStorage.getItem('ng031-marker')||'';
document.querySelector('#save').onclick=()=>{localStorage.setItem('ng031-marker',marker.value);result.textContent='Tersimpan: '+marker.value};
marker.oninput=()=>{document.title='NG031 '+marker.value;result.textContent='Input: '+marker.value};
</script></html>
